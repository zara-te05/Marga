<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none" class="w-full h-full">
  <defs>
    <linearGradient id="marga-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="marga-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="40" height="40" rx="10" fill="#111827" stroke="#232F4D" stroke-width="1.5"/>
  <!-- Stylized Database Nodes & Intertwined M -->
  <path d="M11 28V12L20 20L29 12V28" stroke="url(#marga-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- DB Node Disks -->
  <circle cx="11" cy="12" r="2.5" fill="#8B5CF6"/>
  <circle cx="29" cy="12" r="2.5" fill="#38BDF8"/>
  <circle cx="20" cy="20" r="2.5" fill="#6366F1"/>
  <circle cx="11" cy="28" r="2.5" fill="#7C3AED"/>
  <circle cx="29" cy="28" r="2.5" fill="#0284C7"/>
  <!-- Subtle center pulse -->
  <circle cx="20" cy="28" r="1.5" fill="#60A5FA" opacity="0.8"/>
</svg>
