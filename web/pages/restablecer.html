<!DOCTYPE html>
<html class="dark" lang="es">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <meta content="web_dashboard" name="shell-type">
  <title>Marga — Nueva contraseña</title>
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/marga.css">
  <link rel="stylesheet" href="../assets/css/marga-shared.css">
</head>
<body class="bg-marga-bg text-neutral-200 antialiased selection:bg-brand-violet selection:text-neutral-950 min-h-screen flex items-center justify-center p-4 canvas-grid">

<body class="bg-marga-bg text-neutral-200 antialiased selection:bg-brand-violet selection:text-neutral-950 min-h-screen flex items-center justify-center p-4 canvas-grid">
  <main class="relative w-full max-w-sm">
    <div class="text-center mb-6">
      <span class="text-3xl font-semibold text-white tracking-tight">Marga</span>
    </div>

    <section class="rounded-2xl bg-marga-surface border border-marga-border shadow-2xl overflow-hidden">
      <div class="px-6 pt-5 pb-1">
        <h1 class="text-sm font-semibold text-white">Elige una contraseña nueva</h1>
        <p class="text-xs text-neutral-400 mt-1">Al guardarla se cierran tus sesiones abiertas en otros equipos.</p>
      </div>
      <form id="form" class="p-6 pt-4 flex flex-col gap-4" novalidate>
        <div class="flex flex-col gap-1.5">
          <label for="password" class="text-xs font-semibold text-neutral-300">Contraseña nueva</label>
          <input id="password" type="password" autocomplete="new-password" class="h-10 px-3.5 rounded-lg bg-marga-card border border-marga-border text-xs text-white placeholder:text-neutral-500 focus:outline-none focus:border-brand-violet" placeholder="Mínimo 8 caracteres">
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="password2" class="text-xs font-semibold text-neutral-300">Repítela</label>
          <input id="password2" type="password" autocomplete="new-password" class="h-10 px-3.5 rounded-lg bg-marga-card border border-marga-border text-xs text-white placeholder:text-neutral-500 focus:outline-none focus:border-brand-violet" placeholder="••••••••">
        </div>
        <p id="form-error" class="hidden text-xs text-neutral-400 bg-neutral-500/10 border border-neutral-500/30 rounded-lg px-3 py-2"></p>
        <button type="submit" id="submit-btn" class="h-10 rounded-lg bg-brand-violet hover:bg-neutral-300 text-neutral-950 text-xs font-semibold shadow-md transition-all flex items-center justify-center gap-2 disabled:opacity-60">
          <span class="material-symbols-outlined text-[18px]">key</span>
          <span>Guardar y entrar</span>
        </button>
        <a href="login.html" class="text-center text-[11px] text-neutral-500 hover:text-white">Volver a iniciar sesión</a>
      </form>
    </section>
  </main>

  <script src="../assets/js/marga-common.js"></script>
  <script src="../assets/js/marga-api.js"></script>
  <script>
    // El token viene después de # (#token=…): así no queda en los logs del servidor.
    const token = new URLSearchParams(location.hash.slice(1)).get('token') || '';
    history.replaceState(null, '', location.pathname); // que no quede en el historial

    function showError(msg) {
      const el = document.getElementById('form-error');
      el.textContent = msg;
      el.classList.toggle('hidden', !msg);
    }
    if (!token) showError('Este enlace está incompleto. Pide uno nuevo desde «¿Olvidaste tu contraseña?».');

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      showError('');
      const p1 = document.getElementById('password').value;
      const p2 = document.getElementById('password2').value;
      if (!token) return showError('Este enlace está incompleto. Pide uno nuevo.');
      if (p1.length < 8) return showError('La contraseña debe tener al menos 8 caracteres.');
      if (p1 !== p2) return showError('Las contraseñas no coinciden.');
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      try {
        await MargaAPI.post('/auth/restablecer', { token, password: p1 });
        location.replace('proyectos.html');
      } catch (err) {
        showError(err.message);
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
