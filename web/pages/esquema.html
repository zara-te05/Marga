<!DOCTYPE html>
<html class="dark" lang="es">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <meta content="web_dashboard" name="shell-type">
  <title>Esquema — Marga</title>
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/marga.css">
  <link rel="stylesheet" href="../assets/css/marga-shared.css">
</head>
<body data-scope="project" data-page="esquema" class="bg-marga-bg text-neutral-200 antialiased selection:bg-brand-violet selection:text-neutral-950 h-screen flex flex-col overflow-hidden">

  <header id="marga-header" class="sticky top-0 z-50 shrink-0 h-16"></header>

  <!-- Barra de herramientas -->
  <div class="h-12 shrink-0 px-5 lg:px-8 flex items-center justify-between gap-3 border-b border-marga-border">
    <div class="flex items-center gap-3 min-w-0">
      <label class="flex items-center gap-1 h-8 pl-2.5 rounded-md bg-marga-surface border border-marga-border">
        <span class="material-symbols-outlined text-[16px] text-neutral-400">dns</span>
        <select id="s-entorno" class="bg-transparent border-0 py-0 pl-1 pr-8 text-sm font-mono text-white focus:outline-none focus:ring-0 cursor-pointer"></select>
      </label>
      <span id="s-info" class="text-xs text-neutral-500 truncate"></span>
      <a id="s-drift" href="#" class="hidden items-center gap-1 text-xs text-white hover:underline">
        <span class="material-symbols-outlined text-[15px]">warning</span><span></span>
      </a>
    </div>
    <div class="flex items-center gap-1">
      <button type="button" id="s-menos" title="Alejar" class="w-8 h-8 rounded-md text-neutral-400 hover:text-white hover:bg-marga-card"><span class="material-symbols-outlined text-[18px]">remove</span></button>
      <span id="s-zoom" class="w-12 text-center font-mono text-xs text-neutral-400">100%</span>
      <button type="button" id="s-mas" title="Acercar" class="w-8 h-8 rounded-md text-neutral-400 hover:text-white hover:bg-marga-card"><span class="material-symbols-outlined text-[18px]">add</span></button>
      <button type="button" id="s-ajustar" class="ml-1 h-8 px-3 rounded-md border border-marga-border text-xs text-neutral-300 hover:text-white hover:border-neutral-500">Ajustar</button>
    </div>
  </div>

  <main class="flex-1 min-h-0 flex">
    <div id="s-lienzo" class="relative flex-1 overflow-hidden canvas-dots cursor-grab select-none">
      <div id="s-plano" class="absolute top-0 left-0 origin-top-left">
        <svg id="s-lineas" class="absolute top-0 left-0 overflow-visible pointer-events-none"></svg>
      </div>
      <div id="s-vacio" class="hidden absolute inset-0 flex items-center justify-center p-6">
        <div class="max-w-md text-center text-sm text-neutral-400 flex flex-col gap-3"></div>
      </div>
    </div>

    <aside id="s-inspector" class="hidden w-96 shrink-0 border-l border-marga-border bg-marga-surface flex-col min-h-0">
      <div class="flex items-center justify-between px-4 h-12 border-b border-marga-border shrink-0">
        <span id="i-nombre" class="font-mono text-sm text-white truncate"></span>
        <button type="button" id="i-cerrar" class="text-neutral-400 hover:text-white"><span class="material-symbols-outlined text-[18px]">close</span></button>
      </div>
      <div id="i-cuerpo" class="flex-1 overflow-y-auto p-4 flex flex-col gap-5 text-sm"></div>
    </aside>
  </main>

  <script src="../assets/js/marga-common.js"></script>
  <script src="../assets/js/marga-demo.js"></script>
  <script src="../assets/js/marga-api.js"></script>
  <script src="../assets/js/marga-layout.js"></script>
  <script src="../assets/js/esquema.js"></script>
</body>
</html>
